<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Generator WebP Gratis</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f9; }
        .box { border: 2px dashed #ccc; padding: 30px; background: white; max-width: 400px; margin: 0 auto; border-radius: 8px; }
        #downloadBtn { display: none; margin-top: 20px; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>

    <h2>Generator Gambar ke WebP</h2>
    <div class="box">
        <input type="file" id="uploadInput" accept="image/*"><br><br>
        <label for="quality">Kualitas (0.1 - 1.0):</label>
        <input type="number" id="quality" value="0.8" min="0.1" max="1.0" step="0.1" style="width: 50px;">
        <br>
        <a id="downloadBtn">Unduh WebP</a>
    </div>

    <script>
        const uploadInput = document.getElementById('uploadInput');
        const qualityInput = document.getElementById('quality');
        const downloadBtn = document.getElementById('downloadBtn');

        uploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Membuat canvas untuk memproses gambar
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    
                    // Mengonversi ke WebP
                    const quality = parseFloat(qualityInput.value) || 0.8;
                    const webpDataUrl = canvas.toDataURL('image/webp', quality);
                    
                    // Menyiapkan tombol unduh
                    downloadBtn.href = webpDataUrl;
                    downloadBtn.download = file.name.substring(0, file.name.lastIndexOf('.')) + '.webp';
                    downloadBtn.style.display = 'inline-block';
                    downloadBtn.innerText = 'Unduh ' + downloadBtn.download;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <link rel="shortcut icon" href="../asset/logo.svg" />
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css" />
    <link rel="stylesheet" href="../asset/styles.css" />
    <link rel="stylesheet" href="/asset/maintenance.css">
    
    <!-- Title dan Canonical Dinamis -->
    <title id="page-title">SugarWish - Preview Themes</title>
    <link id="canonical-url" rel="canonical" href="" />

    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            color-scheme: light;
        }
        iframe {
            height: 100%;
            width: 100%;
            margin: 0;
            border: 0;
        }
    </style>
</head>
<body>
    <header style="height: 60px !important">
        <a href="javascript:void(0);" onclick="goBack()" class="btn-back" style="color: var(--font-color); font-size: 1.2rem; font-weight: 500; cursor: pointer">
            <i class="bx bx-left-arrow-alt" style="vertical-align: middle; line-height: 1.2rem; font-size: 2rem"></i> Kembali
        </a>
        <a class="btn-border" href="javascript:void(0);" onclick="showPopupOrder()" style="padding: 7px 10px">
            <i class="bx bxl-whatsapp"></i> Pesan Sekarang
        </a>
    </header>

    <div class="popup-container">
        <div class="card">
            <div class="bx bx-x" id="close-icon"></div>
            <p class="text"><b>Terima kasih udah mau pesan 💖</b><br />Untuk pemesanan lanjut, silakan hubungi kami via WhatsApp ya</p>
            <a class="btn-order" href="https://wa.me/6283853324945?text=Halo%20Admin%20SugarWish,%20saya%20tertarik%20ingin%20memesan%20website%20ucapan%20ini." target="_blank">
                <i class="bx bxl-whatsapp"></i>
                Chat WhatsApp
            </a>
        </div>
    </div>

    <script>
        // Script Popup WhatsApp
        const popupContainer = document.querySelector(".popup-container");
        const btnClosePopup = document.querySelector("#close-icon");

        function showPopupOrder() {
            popupContainer.classList.add("show");
        }

        function closePopupOrder() {
            popupContainer.classList.remove("show");
        }

        btnClosePopup.onclick = closePopupOrder;
    </script>

    <div style="position: fixed; top: 60px; left: 0; right: 0; bottom: 0; padding: 0 !important">
        <iframe id="content-frame"></iframe>
    </div>
    <script src="/asset/maintenance.js"></script>
    <script src="script.js"></script>
</body>
</html>
